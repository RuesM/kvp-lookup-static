<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KVP Lookup (Static)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    label, input, button { display:block; margin: 8px 0; }
    .controls { margin-top: 8px; }
    .controls button { margin-right: 8px; }
    .result { margin-top: 16px; padding: 12px; border-radius:6px; }
    .found { background:#e6ffed; border:1px solid #b7f0c6; }
    .notfound { background:#fff0f0; border:1px solid #f1b2b2; }
    .small { font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <h1>KVPLookup (Static)</h1>
  <p clas="small">Naloženo <strong><span id="count">0</span></strong> klicnih znakov</p>

  <form id="lookupForm">
    <label for="callsign">Vnesi znak</label>
    <input id="callsign" name="callsign" autocomplete="off" required />
    <div class="controls">
      <button type="submit">Išči</button>
      <button type="button" id="clearBtn">Briši</button>
    </div>
  </form>

  <div id="output" aria-live="polite"></div>

  <script>
    // Load callsigns.json and build a lookup map
    const CALLSIGN_MAP = Object.create(null);
    async function loadCallsigns() {
      try {
        const res = await fetch('callsigns.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('Failed to load callsigns.json: ' + res.status);
        const data = await res.json();
        data.forEach(item => {
          const cs = (item.callsign || '').trim().toUpperCase();
          if (cs) CALLSIGN_MAP[cs] = item.year;
        });
        // optionally signal ready
        const countEl = document.getElementById('count');
        if (countEl) countEl.TextContent = Object.keys(CALLSIGN_MAP).length.toString();
        console.log('Loaded', Object.keys(CALLSIGN_MAP).length, 'callsigns');
      } catch (err) {
        console.error(err);
        const output = document.getElementById('output');
        output.innerHTML = `<div class="result notfound">Unable to load callsigns.json: ${err.message}</div>`;
        const countEl = document.getElementById('count');
        if(countEl) countEl.textContent = '0';
      }
    }

    loadCallsigns();

    const form = document.getElementById('lookupForm');
    const output = document.getElementById('output');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      output.textContent = '';
      const cs = document.getElementById('callsign').value.trim();
      if (!cs) return;

      const lookup = cs.toUpperCase();
      let year = CALLSIGN_MAP[lookup];
      if (year === undefined) {
        // normalization: remove slashes and dashes
        const alt = lookup.replace(/\//g, '').replace(/-/g, '');
        year = CALLSIGN_MAP[alt];
      }

      if (year !== undefined) {
        output.innerHTML = `<div class="result found">Našel: <strong>${cs}</strong> — Letnica: <strong>${year}</strong></div>`;
      } else {
        output.innerHTML = `<div class="result notfound">Not Found: <strong>${cs}</strong></div>`;
      }
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      document.getElementById('callsign').value = '';
      output.textContent = '';
      document.getElementById('callsign').focus();
    });

    // If the page is opened with ?callsign=..., populate and lookup
    (function checkQuery() {
      try {
        const params = new URLSearchParams(location.search);
        const cs = params.get('callsign');
        if (cs) {
          document.getElementById('callsign').value = cs;
          // wait a tick to ensure map is loaded
          setTimeout(()=> document.getElementById('lookupForm').dispatchEvent(new Event('submit')) , 250);
        }
      } catch(e){/* ignore */}
    })();
  </script>
</body>
</html>
